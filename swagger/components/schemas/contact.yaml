type: object
required:
  - name
  - phoneNumber
  - email
  - contactType
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'Samantha Fox'
  phoneNumber:
    description: "Contact's phonenumber"
    type: string
    example: '+380000000222'
  email:
    description: "Contact's email"
    type: string
    example: 'samanthafox@gmail.com'
  contactType:
    description: 'What type of contact is this'
    type: string
    enum: ['work', 'home', 'personal']
    example: home
  isFavourite:
    description: 'Whether is contact favourite'
    type: boolean
    example: true
    default: false
  userId:
    description: "Contact's user id"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to student's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
    default: null