tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Samantha Fox'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380000000503'
          email:
            description: "Contact's email"
            type: string
            example: 'samanthafox@gmail.com'
          contactType:
            description: 'Type of contact'
            type: string
            enum: ['work', 'home', 'personal']
            example: personal
          isFavourite:
            description: 'Is the contact marked as favourite?'
            type: boolean
            example: false
          photo:
            type: string
            format: binary
            description: "Link to contact's photo"
            example: https://res.cloudinary.com/de3pzgt9w/image/upload/v1730990743/kbox8a38w7i6fvoebjwd.webp
responses:
  '201':
    description: 'Creates a contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully created contact'
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'